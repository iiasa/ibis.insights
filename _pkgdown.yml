url: https://iiasa.github.io/ibis.insights/

template:
  bootstrap: 5
  bslib:
    primary: "#1F6E8C"
    border-radius: 0.25rem
  includes:
    in_header: |
      <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["$$", "$$"]]
        }
      };
      </script>
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
      </script>

home:
  title: ibis.insights
  description: >
    InSiGHTS habitat availability indicators for standalone raster workflows
    and ibis.iSDM model outputs.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: 1) General InSiGHTS functions
        href: articles/insights-functions.html
      - text: 2) ibis.iSDM integration
        href: articles/ibis-isdm-integration.html
      - text: 3) Helper functions
        href: articles/general-helper-functions.html

articles:
- title: Articles
  contents:
  - insights-functions
  - ibis-isdm-integration
  - general-helper-functions

reference:
- title: Apply insights
  desc: Refine range or suitability estimates with habitat, land-use, and maturity layers.
  contents:
  - insights_fraction
  - insights_area
  - insights_discount
- title: Summarize indicators
  desc: Convert refined habitat rasters into area totals or relative indicators.
  contents:
  - insights_summary
  - relChange
  - relChangeSym
- title: Helper functions
  contents:
  - align_temporal
  - st_clamp
  - create_derivate_range
  - create_elevation_mask
  - apply_elevation_mask
